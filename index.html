<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#032d23">
<meta name="description" content="دانلود نرم‌افزار جامع پایش تربیتی، مجموعه رایة الهدی، نسخه اندروید ۱۶">
<title>پایش | دانلود نرم‌افزار جامع پایش تربیتی</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:radial-gradient(ellipse at center,#0e513b,#00271f 65%,#001b16);color:#fff6d9;font-family:Tahoma,Arial,sans-serif}main{height:100vh;height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;overflow:hidden}.art{position:relative;width:min(100vw,calc(100dvh * 1122 / 1402));aspect-ratio:1122/1402;line-height:0;flex-shrink:0}.art img{width:100%;height:100%;display:block}.hotspot{position:absolute;display:block;z-index:2;border-radius:20px;outline-offset:2px}.hotspot:focus-visible{outline:3px solid #ffe091}.download-spot{left:10%;top:77.7%;width:50%;height:9.5%}.github-spot{left:63%;top:78%;width:29%;height:9%}
</style>
</head>
<body>
<main>
<section class="art" aria-label="معرفی نرم‌افزار پایش">
<img src="cover.png" alt="پایش، نرم‌افزار جامع پایش تربیتی؛ مدیریت برنامه‌ها و رویدادها، پیگیری فعالیت‌های تربیتی و امکان استفاده آفلاین" fetchpriority="high">
<a class="hotspot download-spot" href="Payesh-v16.apk" download="Payesh-v16.apk" type="application/vnd.android.package-archive" aria-label="دانلود نسخه اندروید نرم‌افزار پایش ۱۶"></a>
<a class="hotspot github-spot" href="https://github.com/" id="repo-link" target="_blank" rel="noopener noreferrer" aria-label="رفتن به GitHub"></a>
</section>

</main>
<script>if(location.hostname.endsWith("github.io")){const owner=location.hostname.split(".")[0];const repo=location.pathname.split("/").filter(Boolean)[0]||owner+".github.io";document.getElementById("repo-link").href=`https://github.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`}</script>
</body>
</html>
